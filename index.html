<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
// Prevent double-tap zoom in iOS WebViews without blocking scrolling or pinch zoom.
(() => {
  let start = null;
  let previousTap = null;

  document.addEventListener('touchstart', event => {
    if (event.touches.length !== 1) {
      start = null;
      previousTap = null;
      return;
    }
    const touch = event.touches[0];
    start = { x: touch.clientX, y: touch.clientY, time: event.timeStamp };
  }, { passive: true });

  document.addEventListener('touchmove', event => {
    const touch = event.touches[0];
    if (!start || event.touches.length !== 1 ||
        Math.hypot(touch.clientX - start.x, touch.clientY - start.y) > 10) {
      start = null;
      previousTap = null;
    }
  }, { passive: true });

  document.addEventListener('touchcancel', () => {
    start = null;
    previousTap = null;
  }, { passive: true });

  document.addEventListener('touchend', event => {
    if (!start || event.touches.length !== 0 ||
        event.changedTouches.length !== 1 || event.timeStamp - start.time > 350) {
      start = null;
      previousTap = null;
      return;
    }
    const touch = event.changedTouches[0];
    const tap = { x: touch.clientX, y: touch.clientY, time: event.timeStamp };
    const isDoubleTap = previousTap && tap.time - previousTap.time < 350 &&
      Math.hypot(tap.x - previousTap.x, tap.y - previousTap.y) < 32;
    start = null;
    previousTap = tap;

    if (isDoubleTap && event.cancelable && !event.defaultPrevented) {
      event.preventDefault();
      // Keep the second tap on buttons, labels and cart controls working.
      if (event.target instanceof HTMLElement && event.target.isConnected) {
        event.target.click();
      }
    }
  }, { passive: false });

  document.addEventListener('dblclick', event => {
    if (event.cancelable) event.preventDefault();
  }, { passive: false });
})();
</script>

<style>
* { box-sizing: border-box; touch-action: manipulation; }

body {
  margin: 0;
  padding-bottom: 110px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f6f5;
  color: #151515;

header {

  color: white;
  padding: 22px 18px;
  border-radius: 0 0 28px 28px;
}

  font-size: 34px;

}

.logo span { color: #8ee38f; }

  margin-top: 5px;
  opacity: .7;
  font-size: 14px;
}

.container { padding: 22px 16px; }

h2 {
  margin: 0 0 16px;
  font-size: 23px;
}

  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

  width: 100%;

}

  border: 0;
  font-family: inherit;
  cursor: pointer;
}

.add-button {
  background: #111;
  color: white;
  padding: 13px 22px;
  border-radius: 14px;

  font-weight: 700;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 20;
  align-items: flex-end;
}

.modal-content {
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 28px 28px 0 0;
  padding: 22px 18px 30px;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  padding-right: 20px;
}

.section-title {
  margin: 23px 0 8px;
  font-weight: 750;
}

.option {

}

}

}

  margin-top: 23px;

}

.close {
  width: 100%;
  background: transparent;
  padding: 14px;

}

<style>
.cart-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 50;
  align-items: flex-end;
}

.cart-sheet {
  background: #fff;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 28px 28px 0 0;
  padding: 22px 18px 30px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.cart-title {
  font-size: 26px;
  font-weight: 800;
}

.cart-close {
  background: #f1f1f1;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 18px;
}

.cart-item {
  padding: 16px 0;
  border-bottom: 1px solid #eee;
}

.cart-item-name {
  font-size: 17px;
  font-weight: 750;
}

.cart-item-options {
  margin-top: 6px;
  color: #777;
  font-size: 13px;
  line-height: 1.4;
}

.cart-item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.cart-quantity {
  display: flex;
  align-items: center;
  gap: 12px;
}

.qty-button {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: #f1f1f1;
  font-size: 20px;
}

.cart-item-price {
  font-size: 17px;
  font-weight: 800;
}

.cart-summary {
  display: flex;
  justify-content: space-between;
  font-size: 21px;
  margin-top: 22px;
}

.checkout-button {
  width: 100%;
  margin-top: 18px;
  padding: 17px;
  border-radius: 17px;
  background: #111;
  color: #fff;
  font-size: 17px;
  font-weight: 800;
}
</style>

</head>

<body>

<header>
  <div class="logo">fit<span>me</span></div>
  <div class="location">📍 ТЦ Family Room</div>
</header>

<main class="container">
  <h2>Авторские коктейли</h2>
  <div id="products"></div>
</main>

<div class="cart" id="cart">
  <span id="cartCount">Корзина · 0</span>
  <span id="cartTotal">0 ₽ →</span>
</div>


<div class="cart-modal" id="cartModal">
  <div class="cart-sheet">
    <div class="cart-header">
      <div class="cart-title">Корзина</div>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>
    <p id="pendingNotice" hidden style="padding:14px;background:#fff3cd;border-radius:14px;line-height:1.4;">Проверяем отправку вашего заказа. Его состав сохранён. Пока доставка не подтверждена, не оформляйте такой же заказ заново.</p>

    
<div id="pickupBlock" style="margin-top:22px;">
  <div style="font-size:18px;font-weight:800;margin-bottom:12px;">
    Где заберёте заказ?
  </div>

  <div id="pickupOptions"></div>

  <div style="margin-top:16px;padding:14px;background:#f5f6f5;border-radius:14px;font-weight:700;">
    ⏱ Будем готовить до 10 минут
  </div>
</div>

<div class="cart-summary">
      <span>Итого</span>
      <strong id="cartGrandTotal">0 ₽</strong>
    </div>

    <button class="checkout-button" id="checkoutButton">
      Оформить заказ
    </button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">

    <div class="modal-title" id="modalTitle"></div>
    <div class="product-info" id="modalInfo"></div>

    <div class="section-title">Выберите молоко</div>
    <div id="milkOptions"></div>
    <div class="section-title">Добавить БАДы</div>
    <div id="supplementOptions"></div>

    <button class="modal-add" id="modalAdd">
      Добавить в корзину
    </button>

    <button class="close" onclick="closeModal()">Отмена</button>

  </div>
</div>

<script>
const API = 'https://red-star-21aa.ufitme.workers.dev/';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
let catalog = null;
let products = [];
let selectedProduct = null;
let currentPrice = 0;
let cartItems = [];
let orderIsSending = false;
let pendingOrder = null;
const PENDING_KEY = 'fitme.pending-order.v2';
const productsEl = document.getElementById('products');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalAdd = document.getElementById('modalAdd');
const checkoutButton = document.getElementById('checkoutButton');
const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const totalOf = items => items.reduce((sum, item) => sum + item.price * item.quantity, 0);
const allowedMilk = product => catalog.milk.filter(m => m.available !== false && (!product.milk_ids || product.milk_ids.includes(m.id)));
const allowedSupplements = product => catalog.supplements.filter(s => s.available !== false && (!product.supplement_ids || product.supplement_ids.includes(s.id)));

function lockCart() {
  const locked = !!pendingOrder || orderIsSending;
  document.querySelectorAll('.qty-button, input[name="pickup"], .add-button, #modalAdd').forEach(el => { el.disabled = locked; });
  checkoutButton.disabled = orderIsSending || (!pendingOrder && !catalog);
  checkoutButton.textContent = orderIsSending ? 'Проверяем заказ…' : pendingOrder ? 'Проверить отправку заказа' : 'Оформить заказ';
  document.getElementById('pendingNotice').hidden = !pendingOrder;
}
function updateCart() {
  document.getElementById('cartCount').textContent = `Корзина · ${cartItems.reduce((sum, item) => sum + item.quantity, 0)}`;
  document.getElementById('cartTotal').textContent = `${totalOf(cartItems)} ₽ →`;
  document.getElementById('cart').style.display = cartItems.length ? 'flex' : 'none';
  lockCart();
}
function closeModal() { modal.style.display = 'none'; }
function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
function openCart() { renderCart(); document.getElementById('cartModal').style.display = 'flex'; }
function renderCart() {
  const box = document.getElementById('cartItems');
  box.innerHTML = cartItems.map((item, index) => `
    <div class="cart-item">
      <div class="cart-item-name">${esc(item.name)}</div>
      <div class="cart-item-options">${esc(item.milk)}<br>${esc(item.supplements.join(', ') || 'Без БАДов')}</div>
      <div class="cart-item-bottom"><div class="cart-quantity">
        <button class="qty-button" data-index="${index}" data-delta="-1">−</button>
        <strong>${item.quantity}</strong><button class="qty-button" data-index="${index}" data-delta="1">+</button>
      </div><div class="cart-item-price">${item.price * item.quantity} ₽</div></div>
    </div>`).join('');
  box.querySelectorAll('.qty-button').forEach(button => button.onclick = () => changeQty(Number(button.dataset.index), Number(button.dataset.delta)));
  document.getElementById('cartGrandTotal').textContent = `${totalOf(cartItems)} ₽`;
  lockCart();
  if (!cartItems.length) closeCart();
}
function changeQty(index, amount) {
  if (pendingOrder || orderIsSending) return;
  if (amount > 0 && cartItems.reduce((sum, item) => sum + item.quantity, 0) >= 20) return alert('За один заказ можно оформить до 20 напитков.');
  cartItems[index].quantity += amount;
  if (cartItems[index].quantity <= 0) cartItems.splice(index, 1);
  updateCart(); renderCart();
}
function openProduct(index) {
  if (pendingOrder || orderIsSending || !catalog) return;
  selectedProduct = products[index];
  modalTitle.textContent = selectedProduct.name;
  document.getElementById('modalInfo').textContent = `${selectedProduct.volume} · от ${selectedProduct.price} ₽`;
  document.getElementById('milkOptions').innerHTML = allowedMilk(selectedProduct).map((milk, i) => `
    <label class="option"><span class="option-left"><input type="radio" name="milk" value="${esc(milk.id)}" ${i === 0 ? 'checked' : ''}>${esc(milk.name)}</span><span>${milk.price ? '+' + milk.price + ' ₽' : 'включено'}</span></label>`).join('');
  document.getElementById('supplementOptions').innerHTML = allowedSupplements(selectedProduct).map(s => `
    <label class="option"><span class="option-left"><input class="supplement" type="checkbox" value="${esc(s.id)}">${esc(s.name)}</span><span>+${s.price} ₽</span></label>`).join('');
  document.querySelectorAll('input[name="milk"], .supplement').forEach(el => el.onchange = calculatePrice);
  calculatePrice(); modal.style.display = 'flex';
}
function calculatePrice() {
  const milk = catalog.milk.find(m => m.id === document.querySelector('input[name="milk"]:checked')?.value);
  const selected = [...document.querySelectorAll('.supplement:checked')].map(el => el.value);
  currentPrice = selectedProduct.price + (milk?.price || 0) + catalog.supplements.filter(s => selected.includes(s.id)).reduce((sum, s) => sum + s.price, 0);
  modalAdd.disabled = !milk || !!pendingOrder;
  modalAdd.textContent = `Добавить в корзину · ${currentPrice} ₽`;
}
modalAdd.onclick = () => {
  if (pendingOrder || orderIsSending || !selectedProduct) return;
  if (cartItems.length >= 15 || cartItems.reduce((sum, item) => sum + item.quantity, 0) >= 20) return alert('За один заказ: до 15 позиций и до 20 напитков.');
  const milk = catalog.milk.find(m => m.id === document.querySelector('input[name="milk"]:checked')?.value);
  if (!milk) return;
  const ids = [...document.querySelectorAll('.supplement:checked')].map(el => el.value);
  cartItems.push({ product_id: selectedProduct.id, name: selectedProduct.name, milk_id: milk.id, milk: milk.name, supplement_ids: ids, supplements: catalog.supplements.filter(s => ids.includes(s.id)).map(s => s.name), price: currentPrice, quantity: 1 });
  closeModal(); updateCart();
};
document.getElementById('cart').onclick = openCart;
modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
document.getElementById('cartModal').addEventListener('click', event => { if (event.target.id === 'cartModal') closeCart(); });

function persistPending(order) {
  // Persist BEFORE sending so a reload/retry keeps the same ID and payload.
  const value = JSON.stringify({ order, display: cartItems });
  localStorage.setItem(PENDING_KEY, value);
  if (localStorage.getItem(PENDING_KEY) !== value) throw new Error('Не удалось сохранить заказ на устройстве.');
  pendingOrder = order;
}
function clearPending() {
  localStorage.removeItem(PENDING_KEY);
  pendingOrder = null;
}
async function submitOrder() {
  if (orderIsSending || !cartItems.length) return;
  if (!pendingOrder) {
    if (!catalog) return;
    const pickup = document.querySelector('input[name="pickup"]:checked')?.value;
    if (!pickup) return alert('Выберите, где вы заберёте заказ');
    const total = totalOf(cartItems);
    const lines = cartItems.map(i => `${i.name} × ${i.quantity}\nМолоко: ${i.milk}\nДобавки: ${i.supplements.join(', ') || 'Без БАДов'}`).join('\n\n');
    if (!confirm(`Ваш заказ:\n\n${lines}\n\n📍 Получение: ${pickup}\n⏱ Будем готовить до 10 минут\n\nИтого: ${total} ₽\n\nОформить заказ?`)) return;
    const user = tg?.initDataUnsafe?.user;
    const order = { order_id: crypto.randomUUID(), catalog_version: catalog.version,
      items: cartItems.map(i => ({ product_id:i.product_id, milk_id:i.milk_id, supplement_ids:[...i.supplement_ids], quantity:i.quantity, price:i.price })),
      total, pickup, user_id:user?.id || null, user_name:user?.first_name || '', username:user?.username || '' };
    try { persistPending(order); } catch {
      return alert('Не удалось сохранить заказ на устройстве. Отправка не выполнялась. Проверьте доступ к хранилищу приложения.');
    }
  }
  orderIsSending = true; lockCart();
  try {
    const response = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(pendingOrder), signal:AbortSignal.timeout(25000) });
    const result = await response.json();
    if (response.ok && result.ok && result.order_id === pendingOrder.order_id) {
      const pickup = pendingOrder.pickup;
      // If local storage cannot clear, retain the snapshot: replay is server-safe.
      clearPending(); cartItems = [];
      document.querySelectorAll('input[name="pickup"]').forEach(el => { el.checked = false; });
      closeCart(); updateCart(); renderCart();
      alert(`Заказ успешно оформлен ✅\n\n⏱ Будем готовить до 10 минут.\n📍 Получение: ${pickup}`);
    } else if (['CATALOG_CHANGED','PRICE_CHANGED','INVALID_ITEMS','INVALID_ITEM','INVALID_MODIFIER','INVALID_QUANTITY','INVALID_PICKUP','ORDER_TOO_LONG','UPDATE_REQUIRED'].includes(result.code)) {
      clearPending();
      alert(result.error || 'Проверьте состав заказа.');
      if (['CATALOG_CHANGED','PRICE_CHANGED'].includes(result.code)) {
        cartItems = []; updateCart(); renderCart(); await loadCatalog();
      }
    } else {
      alert((result.error || 'Не удалось подтвердить отправку заказа.') + '\n\nКнопка «Проверить отправку заказа» использует тот же заказ и не создаёт новый.');
    }
  } catch {
    alert('Ответ сервера не получен. Заказ мог поступить сотрудникам.\n\nНажмите «Проверить отправку заказа». Состав и номер сохранены; новый заказ не создаётся.');
  } finally { orderIsSending = false; updateCart(); renderCart(); }
}
checkoutButton.onclick = submitOrder;

async function loadCatalog() {
  productsEl.textContent = 'Загружаем меню…';
  try {
    const response = await fetch(API + 'catalog', {cache:'no-store', signal:AbortSignal.timeout(12000)});
    const data = await response.json();
    if (!response.ok || !data.ok || !Array.isArray(data.catalog?.products)) throw new Error('Menu unavailable');
    catalog = data.catalog;
    products = catalog.products.filter(p => p.available !== false);
    productsEl.innerHTML = products.map((p, index) => `
      <article class="product"><img class="product-image" src="${esc(p.image)}" alt="${esc(p.name)}">
      <div class="product-body"><div class="product-title">${esc(p.name)}</div><div class="product-info">Авторский протеиновый коктейль · ${esc(p.volume)}</div>
      <div class="product-bottom"><div class="price">${p.price} ₽</div><button class="add-button" data-index="${index}">Выбрать</button></div></div></article>`).join('');
    productsEl.querySelectorAll('.add-button').forEach(button => button.onclick = () => openProduct(Number(button.dataset.index)));
    document.getElementById('pickupOptions').innerHTML = catalog.pickup.map((p,i) => `<label class="option"><span class="option-left"><input type="radio" name="pickup" value="${esc(p)}">${i === 0 ? '🏋️' : '🛎️'} ${esc(p)}</span></label>`).join('');
    if (pendingOrder) document.querySelectorAll('input[name="pickup"]').forEach(el => { el.checked = el.value === pendingOrder.pickup; });
  } catch {
    catalog = null;
    productsEl.innerHTML = '<p>Не удалось загрузить меню.</p><button class="add-button" id="reloadMenu">Повторить</button>';
    document.getElementById('reloadMenu').onclick = loadCatalog;
  }
  lockCart();
}
try {
  const saved = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');
  if (saved?.order?.order_id && Array.isArray(saved.display) && saved.display.length) {
    pendingOrder = saved.order; cartItems = saved.display; updateCart(); renderCart();
  }
} catch { /* No request is sent until durable storage can be written. */ }
loadCatalog();
</script>

</body>
</html>
