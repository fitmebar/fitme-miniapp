<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitMe Bar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding-bottom: 110px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f6f5;
  color: #151515;
}

header {
  background: #111;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 28px 28px;
}

.logo {
  font-size: 34px;
  font-weight: 850;
  letter-spacing: -2px;
}

.logo span { color: #8ee38f; }

.location {
  margin-top: 5px;
  opacity: .7;
  font-size: 14px;
}

.container { padding: 22px 16px; }

h2 {
  margin: 0 0 16px;
  font-size: 23px;
}

.product {
  background: white;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.product-image {
  width: 100%;
  height: 240px;
  object-fit: contain;
  background: #ffffff;
  display: block;
  padding: 0;
}
.product-body { padding: 17px; }

.product-title {
  font-size: 19px;
  font-weight: 750;
}

.product-info {
  color: #777;
  font-size: 14px;
  margin-top: 5px;
}

.product-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 15px;
  gap: 15px;
}

.price {
  font-size: 21px;
  font-weight: 800;
  white-space: nowrap;
}

button {
  border: 0;
  font-family: inherit;
  cursor: pointer;
}

.add-button {
  background: #111;
  color: white;
  padding: 13px 22px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 20;
  align-items: flex-end;
}

.modal-content {
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 28px 28px 0 0;
  padding: 22px 18px 30px;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  padding-right: 20px;
}

.section-title {
  margin: 23px 0 8px;
  font-weight: 750;
}

.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
  gap: 10px;
}

.option-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

input {
  width: 20px;
  height: 20px;
  accent-color: #111;
}

.modal-add {
  width: 100%;
  padding: 17px;
  margin-top: 23px;
  border-radius: 17px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: 800;
}

.close {
  width: 100%;
  background: transparent;
  padding: 14px;
  color: #777;
  font-size: 15px;
}

.cart {
  display: none;
  position: fixed;
  left: 14px;
  right: 14px;
  bottom: 14px;
  z-index: 10;
  background: #8ee38f;
  padding: 18px 20px;
  border-radius: 19px;
  font-size: 17px;
  font-weight: 800;
  justify-content: space-between;
  box-shadow: 0 7px 28px rgba(0,0,0,.18);
}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{margin-bottom:0;border-radius:20px;display:flex;flex-direction:column;min-width:0}.product-image{width:100%;height:180px;object-fit:contain;background:#fff;padding:6px}.product-body{padding:13px;display:flex;flex-direction:column;flex:1}.product-title{font-size:16px;line-height:1.15}.product-info{font-size:12px}.product-bottom{display:block;margin-top:auto;padding-top:12px}.price{font-size:19px;margin-bottom:9px}.add-button{width:100%;padding:12px 6px}</style>

<style>
.cart-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 50;
  align-items: flex-end;
}

.cart-sheet {
  background: #fff;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 28px 28px 0 0;
  padding: 22px 18px 30px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.cart-title {
  font-size: 26px;
  font-weight: 800;
}

.cart-close {
  background: #f1f1f1;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 18px;
}

.cart-item {
  padding: 16px 0;
  border-bottom: 1px solid #eee;
}

.cart-item-name {
  font-size: 17px;
  font-weight: 750;
}

.cart-item-options {
  margin-top: 6px;
  color: #777;
  font-size: 13px;
  line-height: 1.4;
}

.cart-item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.cart-quantity {
  display: flex;
  align-items: center;
  gap: 12px;
}

.qty-button {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: #f1f1f1;
  font-size: 20px;
}

.cart-item-price {
  font-size: 17px;
  font-weight: 800;
}

.cart-summary {
  display: flex;
  justify-content: space-between;
  font-size: 21px;
  margin-top: 22px;
}

.checkout-button {
  width: 100%;
  margin-top: 18px;
  padding: 17px;
  border-radius: 17px;
  background: #111;
  color: #fff;
  font-size: 17px;
  font-weight: 800;
}
</style>

</head>

<body>

<header>
  <div class="logo">fit<span>me</span></div>
  <div class="location">📍 ТЦ Family Room</div>
</header>

<main class="container">
  <h2>Авторские коктейли</h2>
  <div id="products"></div>
</main>

<div class="cart" id="cart">
  <span id="cartCount">Корзина · 0</span>
  <span id="cartTotal">0 ₽ →</span>
</div>


<div class="cart-modal" id="cartModal">
  <div class="cart-sheet">
    <div class="cart-header">
      <div class="cart-title">Корзина</div>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-summary">
      <span>Итого</span>
      <strong id="cartGrandTotal">0 ₽</strong>
    </div>

    <button class="checkout-button" id="checkoutButton">
      Оформить заказ
    </button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">

    <div class="modal-title" id="modalTitle"></div>
    <div class="product-info">500 мл · от 480 ₽</div>

    <div class="section-title">Выберите молоко</div>

    <label class="option">
      <span class="option-left">
        <input type="radio" name="milk" value="0" data-name="Обычное молоко" checked>
        Обычное молоко
      </span>
      <span>включено</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input type="radio" name="milk" value="70" data-name="Миндальное молоко">
        Миндальное молоко
      </span>
      <span>+70 ₽</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input type="radio" name="milk" value="70" data-name="Кокосовое молоко">
        Кокосовое молоко
      </span>
      <span>+70 ₽</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input type="radio" name="milk" value="70" data-name="Банановое молоко">
        Банановое молоко
      </span>
      <span>+70 ₽</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input type="radio" name="milk" value="70" data-name="Протеиновое молоко Bombbar">
        Протеиновое молоко Bombbar
      </span>
      <span>+70 ₽</span>
    </label>

    <div class="section-title">Добавить БАДы</div>

    <label class="option">
      <span class="option-left">
        <input class="supplement" type="checkbox" value="70" data-name="Креатин">
        Креатин
      </span>
      <span>+70 ₽</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input class="supplement" type="checkbox" value="70" data-name="Таурин">
        Таурин
      </span>
      <span>+70 ₽</span>
    </label>

    <label class="option">
      <span class="option-left">
        <input class="supplement" type="checkbox" value="70" data-name="BCAA">
        BCAA
      </span>
      <span>+70 ₽</span>
    </label>

    <button class="modal-add" id="modalAdd">
      Добавить в корзину · 480 ₽
    </button>

    <button class="close" onclick="closeModal()">Отмена</button>

  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const products = [
  {
    name: "Oreo с овсяными хлопьями",
    image: "images/oreo.png"
  },
  {
    name: "Лесной орех с арахисовой пастой",
    image: "images/hazelnut.png"
  },
  {
    name: "Шоколадный бисквит с эспрессо",
    image: "images/chocolate_biscuit.png"
  },
  {
    name: "Малиновый чизкейк",
    image: "images/raspberry_cheesecake.png"
  }
];

const BASE_PRICE = 480;

let selectedProduct = null;
let currentPrice = BASE_PRICE;
let cartItems = [];

const productsEl = document.getElementById("products");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalAdd = document.getElementById("modalAdd");

products.forEach((product, index) => {
  const card = document.createElement("article");
  card.className = "product";

  card.innerHTML = `
    <img class="product-image"
         src="${product.image}"
         alt="${product.name}">
    <div class="product-body">
      <div class="product-title">${product.name}</div>
      <div class="product-info">
        Авторский протеиновый коктейль · 500 мл
      </div>
      <div class="product-bottom">
        <div class="price">${BASE_PRICE} ₽</div>
        <button class="add-button">Выбрать</button>
      </div>
    </div>
  `;

  card.querySelector(".add-button").onclick = () => openProduct(index);
  productsEl.appendChild(card);
});

function openProduct(index) {
  selectedProduct = products[index];

  document.querySelector(
    'input[name="milk"][value="0"]'
  ).checked = true;

  document.querySelectorAll(".supplement").forEach(el => {
    el.checked = false;
  });

  modalTitle.textContent = selectedProduct.name;
  calculatePrice();
  modal.style.display = "flex";
}

function closeModal() {
  modal.style.display = "none";
}

function calculatePrice() {
  let price = BASE_PRICE;

  const milk = document.querySelector('input[name="milk"]:checked');
  if (milk) price += Number(milk.value);

  document.querySelectorAll(".supplement:checked").forEach(el => {
    price += Number(el.value);
  });

  currentPrice = price;
  modalAdd.textContent = `Добавить в корзину · ${price} ₽`;
}

document.querySelectorAll(
  'input[name="milk"], .supplement'
).forEach(el => {
  el.addEventListener("change", calculatePrice);
});

modalAdd.onclick = () => {
  const milk = document.querySelector('input[name="milk"]:checked');

  const supplements = Array.from(
    document.querySelectorAll(".supplement:checked")
  ).map(el => el.dataset.name);

  cartItems.push({
    name: selectedProduct.name,
    milk: milk.dataset.name,
    supplements,
    price: currentPrice
  });

  closeModal();
  updateCart();
};

function updateCart() {
  const total = cartItems.reduce((sum, item) => sum + item.price, 0);

  document.getElementById("cartCount").textContent =
    `Корзина · ${cartItems.length}`;

  document.getElementById("cartTotal").textContent =
    `${total} ₽ →`;

  document.getElementById("cart").style.display = "flex";
}

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});
</script>


<script>
function openCart() {
  renderCart();
  document.getElementById("cartModal").style.display = "flex";
}

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}

function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  cartItems.forEach((item, index) => {
    if (!item.quantity) item.quantity = 1;

    const supplementsText = item.supplements.length
      ? item.supplements.join(", ")
      : "Без БАДов";

    const el = document.createElement("div");
    el.className = "cart-item";

    el.innerHTML = `
      <div class="cart-item-name">${item.name}</div>

      <div class="cart-item-options">
        ${item.milk}<br>
        ${supplementsText}
      </div>

      <div class="cart-item-bottom">
        <div class="cart-quantity">
          <button class="qty-button" onclick="changeQty(${index}, -1)">−</button>
          <strong>${item.quantity}</strong>
          <button class="qty-button" onclick="changeQty(${index}, 1)">+</button>
        </div>

        <div class="cart-item-price">
          ${item.price * item.quantity} ₽
        </div>
      </div>
    `;

    box.appendChild(el);
  });

  const total = cartItems.reduce(
    (sum, item) => sum + item.price * (item.quantity || 1),
    0
  );

  document.getElementById("cartGrandTotal").textContent = `${total} ₽`;

  if (cartItems.length === 0) {
    closeCart();
  }
}

function changeQty(index, amount) {
  cartItems[index].quantity =
    (cartItems[index].quantity || 1) + amount;

  if (cartItems[index].quantity <= 0) {
    cartItems.splice(index, 1);
  }

  updateCart();
  renderCart();
}

document.getElementById("cart").onclick = openCart;

document.getElementById("cartModal").addEventListener("click", event => {
  if (event.target.id === "cartModal") {
    closeCart();
  }
});
</script>

</body>
</html>
